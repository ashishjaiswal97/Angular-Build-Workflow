name: Angular build 
on:
  push:
    branches: [ main ]

jobs:
  angular-build:
    runs-on: ubuntu-latest   
    steps:
      - name: Checkout
        uses: actions/checkout@v2.8.0
      - name: Setup Node.js environment
        uses: actions/setup-node@v6.2.0
      - name: Install dependencies
        run: npm install
      - name: build package
        run: npm run build
